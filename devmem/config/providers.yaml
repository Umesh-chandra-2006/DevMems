# devmem/config/providers.yaml
# LLM Provider Configuration for DevMem-Agents Fallback Router
providers:
  - name: groq
    priority: 1
    models:
      fast: "openai/gpt-oss-20b"       # High daily quota (14,400 RPD), used for Stage 2 scoring & dialogue
      strong: "openai/gpt-oss-120b"    # Lower daily quota (1,000 RPD), used for Stage 3/4
    keys:
      - env: GROQ_KEY_1
      - env: GROQ_KEY_2
      - env: GROQ_KEY_3
    daily_limit_fast: 14400
    daily_limit_strong: 1000

  - name: nemotron
    priority: 2
    models:
      fast: "nvidia/nemotron-3.5-lightning-30b-a3b"
      strong: "nvidia/llama-3.1-nemotron-70b-instruct"
    keys:
      - env: NIM_KEY_1
    daily_limit_fast: 5000
    daily_limit_strong: 40

  - name: gemini
    priority: 3
    models:
      fast: "gemini-3.6-flash"         # 1,500 RPD free tier quota
      strong: "gemini-3.6-flash"        # 1,500 RPD free tier quota
    keys:
      - env: GEMINI_KEY_1
    daily_limit_fast: 1500
    daily_limit_strong: 1500
